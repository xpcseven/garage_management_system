name: Travel

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [20.9.0]

    env:
      AUTH_SECRET: ${{secrets.AUTH_SECRET}}
      AUTH_TRUST_HOST: ${{secrets.AUTH_TRUST_HOST}}
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      NEXTAUTH_URL: ${{secrets.NEXTAUTH_URL}}
      NEXT_WEBSITE_URL: ${{secrets.NEXT_WEBSITE_URL}}
      AWS_REGION: ${{secrets.AWS_REGION}}
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
      AWS_S3_BUCKET: ${{secrets.AWS_S3_BUCKET}}
      GMAIL_USER: ${{secrets.GMAIL_USER}}
      GMAIL_APP_PASSWORD: ${{secrets.GMAIL_APP_PASSWORD}}
      # Writable by runner user (not /var)
      UPLOAD_DIR: ${{ github.workspace }}/../persistent-uploads
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - name: Persist uploads dir + upsert runtime env
        run: |
          set -e
          UPLOAD_ROOT="${HOME}/travel-uploads"
          mkdir -p "$UPLOAD_ROOT"
          rm -rf public/uploads
          ln -sfn "$UPLOAD_ROOT" public/uploads

          touch .env
          upsert_env() {
            local key="$1"
            local val="$2"
            [ -z "$val" ] && return 0
            val="${val//\\/\\\\}"
            val="${val//$'\n'/\\n}"
            if grep -q "^${key}=" .env; then
              # delete old line(s) then append (safe with special chars)
              grep -v "^${key}=" .env > .env.tmp || true
              mv .env.tmp .env
            fi
            printf '%s=%s\n' "$key" "$val" >> .env
          }

          upsert_env AUTH_SECRET "$AUTH_SECRET"
          # Auth.js expects true/false, not a URL
          if [ -n "$AUTH_TRUST_HOST" ]; then
            case "$AUTH_TRUST_HOST" in
              true|TRUE|1|yes|YES) upsert_env AUTH_TRUST_HOST "true" ;;
              *) upsert_env AUTH_TRUST_HOST "true" ;;
            esac
          else
            upsert_env AUTH_TRUST_HOST "true"
          fi
          upsert_env DATABASE_URL "$DATABASE_URL"
          upsert_env NEXTAUTH_URL "$NEXTAUTH_URL"
          upsert_env NEXT_WEBSITE_URL "$NEXT_WEBSITE_URL"
          upsert_env AWS_REGION "$AWS_REGION"
          upsert_env AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
          upsert_env AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
          upsert_env AWS_S3_BUCKET "$AWS_S3_BUCKET"
          upsert_env GMAIL_USER "$GMAIL_USER"
          upsert_env GMAIL_APP_PASSWORD "$GMAIL_APP_PASSWORD"
          upsert_env UPLOAD_DIR "$UPLOAD_ROOT"
      - name: Restart PM2 with updated env
        run: |
          cd "${{ github.workspace }}"
          pm2 restart 0 --update-env
