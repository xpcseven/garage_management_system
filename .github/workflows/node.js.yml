name: Travel

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [20.9.0]

    env:
      AUTH_SECRET: ${{secrets.AUTH_SECRET}}
      AUTH_TRUST_HOST: ${{secrets.AUTH_TRUST_HOST}}
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      NEXTAUTH_URL: ${{secrets.NEXTAUTH_URL}}
      NEXT_WEBSITE_URL: ${{secrets.NEXT_WEBSITE_URL}}
      AWS_REGION: ${{secrets.AWS_REGION}}
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
      AWS_S3_BUCKET: ${{secrets.AWS_S3_BUCKET}}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - name: Sync runtime AWS env for Next/PM2
        run: |
          set -e
          touch .env
          for KEY in AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_S3_BUCKET; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then
              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" .env
              else
                echo "${KEY}=${VAL}" >> .env
              fi
            fi
          done
      - name: Change Directory
        run: cd /home/travel/actions-runner/_work/garage_management_system/garage_management_system
      - run: pm2 restart 0 --update-env
